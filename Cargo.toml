[workspace]
resolver = "3"
members = ["crates/proto", "crates/armouryd", "crates/armoury", "crates/armoury-root"]

[workspace.package]
edition = "2024"
version = "0.3.2"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
armoury-proto = { path = "crates/proto" }
